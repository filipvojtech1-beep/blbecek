<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141824" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blbeček">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Blbeček</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#d9dee8;
--ok:#1f9d55;--warn:#e8890c;--bad:#d62f3a;--accent:#2d4fd6}
@media (prefers-color-scheme:dark){:root{--bg:#141824;--card:#1e2434;--ink:#e8ecf5;--mute:#98a2b8;--line:#2f374c;--accent:#7b97ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Roboto Mono",ui-monospace,Menlo,Consolas,monospace}
main{max-width:720px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(64px,calc(env(safe-area-inset-bottom) + 32px)) max(16px,env(safe-area-inset-left))}
h1{margin:0;font-size:2.2rem;letter-spacing:-.02em}
.sub{color:var(--mute);margin:2px 0 20px}
.sum{display:flex;gap:10px;margin-bottom:20px}
.sum div{flex:1;background:var(--card);border-radius:10px;padding:10px 12px;border-bottom:4px solid}
.sum b{font-size:1.6rem;display:block}
.sum .g{border-color:var(--ok)}.sum .o{border-color:var(--warn)}.sum .r{border-color:var(--bad)}
form{background:var(--card);border-radius:10px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px}
label.full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;min-height:44px;min-width:0;max-width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
button{font:inherit;cursor:pointer;min-height:40px;touch-action:manipulation;border:0;border-radius:6px;padding:8px 14px;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.del{color:var(--bad)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{grid-column:1/-1;display:flex;gap:8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--ok);color:#fff;border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
li.warn{background:#f5a524;color:#1d2433}
li.bad{background:var(--bad)}
li .btns button{background:rgba(255,255,255,.18);color:inherit;border:1px solid currentColor}
li.warn .btns button{background:rgba(0,0,0,.08)}
.info{flex:1;min-width:180px}
.name{font-weight:700;font-size:1.05rem}
.note{opacity:.85;font-size:.85rem;font-weight:400}
.st{font-weight:700}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{padding:5px 10px;font-size:.85rem}
.empty{text-align:center;color:var(--mute);padding:24px}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px;font-size:.85rem;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1;min-width:140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-size:.85rem}
.chips button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tag{display:inline-block;font-size:.75rem;border:1px solid currentColor;border-radius:99px;padding:0 8px;margin-left:6px;font-weight:400}
footer{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
input[type=date]{width:100%;display:block}
@media(max-width:520px){
  form{grid-template-columns:1fr}
  h1{font-size:1.9rem}
  .sum{gap:8px}
  .sum div{padding:8px 10px;font-size:.8rem}
  .sum b{font-size:1.3rem}
  .filters input{flex:1 1 100%}
  .chips{width:100%}
  .chips button{flex:1;min-height:44px;padding:6px 4px}
  .bar{flex-direction:column;align-items:stretch}
  .bar label{display:none}
  .btns{width:100%}
  .btns button{flex:1;min-height:44px}
  .actions button,footer button{flex:1;min-height:44px}
}
</style>
</head>
<body>
<main>
  <h1>Blbeček</h1>
  <p class="sub">Čo kedy vyprší, na jednom mieste.</p>

  <div class="sum">
    <div class="g"><b id="cg">0</b>v poriadku</div>
    <div class="o"><b id="co">0</b>čoskoro</div>
    <div class="r"><b id="cr">0</b>vypršalo</div>
  </div>

  <form id="f">
    <label class="full">Názov
      <input id="name" required placeholder="napr. Licencia na software">
    </label>
    <label>Expiruje dňa
      <input id="date" type="date" required>
    </label>
    <label>Oranžová, keď zostáva (dní)
      <input id="warn" type="number" min="0" value="14" required>
    </label>
    <label class="full">Kategória (nepovinné)
      <input id="cat" list="cats" placeholder="napr. Práca, Doma, Auto">
      <datalist id="cats"></datalist>
    </label>
    <label class="full">Poznámka (nepovinné)
      <input id="note" placeholder="napr. objednať cez nákup, kontakt Peter">
    </label>
    <div class="actions">
      <button type="submit" id="save">Pridať</button>
      <button type="button" class="ghost" id="cancel" hidden>Zrušiť úpravu</button>
    </div>
  </form>

  <div class="filters">
    <input id="q" type="search" placeholder="Hľadať podľa názvu alebo poznámky" aria-label="Hľadať">
    <div class="chips" id="chips">
      <button type="button" data-s="all" class="on">Všetko</button>
      <button type="button" data-s="bad">Vypršané</button>
      <button type="button" data-s="warn">Čoskoro</button>
      <button type="button" data-s="ok">V poriadku</button>
    </div>
  </div>
  <div class="bar">
    <select id="fcat" aria-label="Kategória"></select>
    <label for="sort" style="flex-direction:row;align-items:center">Radenie:</label>
    <select id="sort" aria-label="Radenie">
      <option value="date">Podľa dátumu (vypršané hore)</option>
      <option value="upcoming">Najbližšie nadchádzajúce hore</option>
    </select>
  </div>
  <ul id="list"></ul>

  <footer>
    <button class="ghost" id="exp">Exportovať zálohu</button>
    <button class="ghost" id="imp">Importovať zálohu</button>
    <input type="file" id="file" accept=".json" hidden>
  </footer>
</main>

<script>
const KEY = "blbecek-v1";
let items = [];
let editId = null;
let sortMode = "date";
let fStatus = "all", fCat = "", fQ = "";
try { sortMode = localStorage.getItem("blbecek-sort") || "date"; } catch (e) {}
const $ = id => document.getElementById(id);

function load() {
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
}

function parse(d) { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd); }
function daysLeft(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((parse(d) - t) / 86400000);
}
function dni(n) { return n === 1 ? "1 deň" : (n >= 2 && n <= 4) ? n + " dni" : n + " dní"; }
function fmt(d) { return parse(d).toLocaleDateString("sk-SK"); }

function status(it) {
  const n = daysLeft(it.date);
  if (n < 0) return { cls: "bad", text: "Vypršalo pred " + dni(-n) };
  if (n === 0) return { cls: "bad", text: "Vyprší dnes" };
  if (n <= it.warn) return { cls: "warn", text: "Vyprší o " + dni(n) };
  return { cls: "", text: "Ešte " + dni(n) };
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function stKey(it) { const c = status(it).cls; return c === "bad" ? "bad" : c === "warn" ? "warn" : "ok"; }

function render() {
  let g = 0, o = 0, r = 0;
  items.forEach(it => { const k = stKey(it); if (k === "bad") r++; else if (k === "warn") o++; else g++; });
  $("cg").textContent = g; $("co").textContent = o; $("cr").textContent = r;
  document.title = (o + r) ? "Blbeček (" + (o + r) + ")" : "Blbeček";

  const cats = [...new Set(items.map(i => i.cat).filter(Boolean))].sort((x, y) => x.localeCompare(y, "sk"));
  if (fCat && !cats.includes(fCat)) fCat = "";
  $("cats").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
  $("fcat").innerHTML = '<option value="">Všetky kategórie</option>' +
    cats.map(c => `<option value="${esc(c)}"${c === fCat ? " selected" : ""}>${esc(c)}</option>`).join("");
  document.querySelectorAll("#chips button").forEach(b => b.classList.toggle("on", b.dataset.s === fStatus));

  const byDate = (x, y) => x.date.localeCompare(y.date);
  let sorted = [...items].sort(byDate);
  if (sortMode === "upcoming") {
    const up = sorted.filter(i => daysLeft(i.date) >= 0);
    const past = sorted.filter(i => daysLeft(i.date) < 0).reverse();
    sorted = [...up, ...past];
  }
  const q = fQ.trim().toLowerCase();
  sorted = sorted.filter(it =>
    (fStatus === "all" || stKey(it) === fStatus) &&
    (!fCat || it.cat === fCat) &&
    (!q || (it.name + " " + (it.note || "") + " " + (it.cat || "")).toLowerCase().includes(q)));

  const empty = items.length ? "Nič nezodpovedá filtru." : "Zatiaľ nič. Pridaj prvú vec hore.";
  $("list").innerHTML = sorted.map(it => {
    const s = status(it);
    return `<li class="${s.cls}">
      <div class="info">
        <div class="name">${esc(it.name)}${it.cat ? `<span class="tag">${esc(it.cat)}</span>` : ""}</div>
        <div class="st">${s.text} <span class="note">(${fmt(it.date)})</span></div>
        ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
      </div>
      <div class="btns">
        <button class="ghost" data-a="renew" data-id="${it.id}">Obnovené +1 rok</button>
        <button class="ghost" data-a="edit" data-id="${it.id}">Upraviť</button>
        <button class="ghost del" data-a="del" data-id="${it.id}">Zmazať</button>
      </div>
    </li>`;
  }).join("") || `<li class="empty" style="display:block;background:var(--card);color:var(--mute)">${empty}</li>`;
}

function resetForm() {
  editId = null;
  $("f").reset(); $("warn").value = 14;
  $("save").textContent = "Pridať";
  $("cancel").hidden = true;
}

$("f").addEventListener("submit", e => {
  e.preventDefault();
  const data = { name: $("name").value.trim(), date: $("date").value, warn: Number($("warn").value), note: $("note").value.trim(), cat: $("cat").value.trim() };
  if (editId) {
    items = items.map(i => i.id === editId ? { ...i, ...data } : i);
  } else {
    items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...data });
  }
  save(); resetForm(); render();
});

$("cancel").onclick = resetForm;

$("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const it = items.find(i => i.id === b.dataset.id); if (!it) return;
  if (b.dataset.a === "del") {
    if (confirm("Zmazať „" + it.name + "“?")) { items = items.filter(i => i !== it); save(); render(); }
  } else if (b.dataset.a === "renew") {
    const d = parse(it.date); d.setFullYear(d.getFullYear() + 1);
    it.date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    save(); render();
  } else {
    editId = it.id;
    $("name").value = it.name; $("date").value = it.date; $("warn").value = it.warn; $("note").value = it.note || ""; $("cat").value = it.cat || "";
    $("save").textContent = "Uložiť zmeny"; $("cancel").hidden = false;
    $("name").focus(); window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 2)], { type: "application/json" }));
  a.download = "blbecek-zaloha.json"; a.click();
};
$("imp").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d)) throw 0;
      items = d.filter(x => x && x.name && x.date).map(x => ({ id: x.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: x.name, date: x.date, warn: Number(x.warn) || 14, note: x.note || "", cat: x.cat || "" }));
      save(); render();
    } catch (err) { alert("Súbor sa nepodarilo načítať."); }
  };
  rd.readAsText(f); e.target.value = "";
};

$("q").oninput = () => { fQ = $("q").value; render(); };
$("fcat").onchange = () => { fCat = $("fcat").value; render(); };
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  fStatus = b.dataset.s; render();
});

$("sort").value = sortMode;
$("sort").onchange = () => {
  sortMode = $("sort").value;
  try { localStorage.setItem("blbecek-sort", sortMode); } catch (e) {}
  render();
};

load(); render();
</script>
</body>
</html>
